name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && fromJSON('["3.10", "3.12"]') || fromJSON('["3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: python -m pytest -q

  install-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && fromJSON('["3.10", "3.12"]') || fromJSON('["3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - run: python -m build -w -o "$RUNNER_TEMP/dist"
      - name: Install wheel into a fresh venv and smoke-test outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv smoke
          smoke/bin/pip install dist/*.whl
          smoke/bin/python -c "import umwelt, umweltd, umweltforge; print('imports ok')"
          smoke/bin/umweltd --help
          smoke/bin/umweltctl --help

